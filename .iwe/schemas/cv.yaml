$schema: https://document-schema.org/draft/2026-06/schema

description: A CV variant — one master plus role-tailored derivations.

frontmatter:
  type: object
  required: [type, variant, language, status]
  properties:
    type:
      const: cv
    variant:
      type: string
      description: master, or the slug of the role this CV was cut for
      pattern: '^[a-z0-9-]+$'
    language:
      enum: [en, da, de, fr, es, sv, nb, nl]
    status:
      enum: [draft, active, archived]
    target:
      type: string
      description: company or role this variant is aimed at
    updated:
      type: [string, "null"]
      format: date
    name:
      type: string
    headline:
      type: string
      description: short professional title under the name
    location:
      type: string
    email:
      type: string
      format: email
    phone:
      type: string
      pattern: '^\+[0-9]{1,3} [0-9][0-9 ]{5,15}$'
      description: >
        Always with country code and a plus sign: «+44 20 7946 0123». The
        plus form is unambiguous wherever the call is made from, and it is
        what an employer abroad sees in the header.
    linkedin:
      type: string
    github:
      type: string

maxTokens: 3000
maxDepth: 3

sections:
  - header:
      pattern: '^[A-Z]'
      maxTokens: 12
      description: the CV title, capitalized, kept short
    maxContains: 1
    description: a CV has exactly one top-level section — the person

    sections:
      - header: { const: Summary }
        maxContains: 1
        maxTokens: 300
        description: every CV opens with a summary paragraph

      - header: { const: Experience }
        maxContains: 1
        description: employment history, most recent first
        allSections:
          header:
            pattern: '^.+ — .+$'
            maxTokens: 16
            description: 'write each entry as "Company — Position (YYYY–)"'

      - header: { const: Clients }
        minContains: 0
        maxContains: 1
        description: optional selected-clients / consultancy list

      - header: { const: Education }
        maxContains: 1
        allSections:
          header:
            pattern: '^.+ — .+$'
            maxTokens: 16
            description: 'write each entry as "Institution — Degree, Field (YYYY–YYYY)"'

      - header: { const: Books }
        minContains: 0
        maxContains: 1

      - header: { const: Projects }
        minContains: 0
        maxContains: 1

      - header: { const: Positions of Trust }
        minContains: 0
        maxContains: 1

      - header: { const: Skills }
        maxContains: 1
        description: every CV ends with the skills section

    additionalSections: false

additionalSections: false
